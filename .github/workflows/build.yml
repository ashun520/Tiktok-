name: Build TikTokNoWatermark dylib

on:
  push:
    branches: [main]
    paths:
      - 'Tweak.xm'
      - 'Tweak.h'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg

      - name: Install Theos and iOS SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$THEOS/sdks"
          find "$RUNNER_TEMP/theos-sdks" -type d -name '*.sdk' -prune -exec cp -R {} "$THEOS/sdks/" \;
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$THEOS/makefiles" >> "$GITHUB_ENV"
          ls -la "$THEOS/sdks"
          test -n "$(find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Compile tweak
        run: |
          make clean
          make
          mkdir -p dist
          find .theos/obj -type f -name '*.dylib' -print -exec cp {} dist/TikTokNoWatermark.dylib \;
          test -s dist/TikTokNoWatermark.dylib
          file dist/TikTokNoWatermark.dylib
          xcrun lipo -info dist/TikTokNoWatermark.dylib

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: TikTokNoWatermark-dylib
          path: dist/TikTokNoWatermark.dylib
          if-no-files-found: error
