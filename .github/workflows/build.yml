name: Build TikTokNoWatermark dylib

on:
  push:
    branches: [main]
    paths:
      - 'Tweak.xm'
      - 'Tweak.h'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Install Theos
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/theos/theos "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          cd "$GITHUB_WORKSPACE/theos/sdks"
          curl -L --fail https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          find . -maxdepth 2 -type d -name '*.sdk' -exec mv {} "$GITHUB_WORKSPACE/theos/sdks/" \;
          rm -rf sdks.zip sdks-master
          test -d "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS.sdk" || find "$GITHUB_WORKSPACE/theos/sdks" -maxdepth 1 -name '*.sdk' -print
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Compile tweak
        shell: bash
        run: |
          set -euxo pipefail
          make clean
          make
          mkdir -p dist
          find .theos -type f -name '*.dylib' -print -exec cp {} dist/TikTokNoWatermark.dylib \;
          test -s dist/TikTokNoWatermark.dylib
          file dist/TikTokNoWatermark.dylib
          xcrun lipo -info dist/TikTokNoWatermark.dylib

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: TikTokNoWatermark-dylib
          path: dist/TikTokNoWatermark.dylib
          if-no-files-found: error
