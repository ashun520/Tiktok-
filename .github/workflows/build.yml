name: Build TikTokNoWatermark dylib

on:
  push:
    branches: [main]
    paths:
      - 'Tweak.xm'
      - 'Tweak.h'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Compile tweak
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean
          make
          mkdir -p dist
          find .theos -type f -name '*.dylib' -print -exec cp {} dist/TikTokNoWatermark.dylib \;
          test -s dist/TikTokNoWatermark.dylib
          file dist/TikTokNoWatermark.dylib
          xcrun lipo -info dist/TikTokNoWatermark.dylib

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: TikTokNoWatermark-dylib
          path: dist/TikTokNoWatermark.dylib
          if-no-files-found: error
